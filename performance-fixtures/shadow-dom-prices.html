<!doctype html><html><head><meta charset="utf-8"><title>Shadow DOM prices</title></head><body><main id="hosts"></main><script>for(let i=0;i<50;i++){const host=document.createElement('price-card');hosts.append(host);host.attachShadow({mode:'open'}).innerHTML=`<style>:host{display:block;padding:8px}</style><span>Shadow price $${i+1}.50</span>`}</script></body></html>
