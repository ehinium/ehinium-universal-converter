<!doctype html><html><head><meta charset="utf-8"><title>Modal overlays</title><style>dialog{position:fixed;inset:20%;width:50%}</style></head><body><p>Page price $88.00</p><button id="open">Open</button><dialog id="modal"><p>Modal price $77.00</p><button id="close">Close</button></dialog><script>open.onclick=()=>modal.showModal();close.onclick=()=>modal.close();setTimeout(()=>modal.showModal(),300);setTimeout(()=>modal.close(),900)</script></body></html>
