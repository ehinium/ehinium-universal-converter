<!doctype html><html><head><meta charset="utf-8"><title>Translation wrappers</title></head><body><h1>Nested translation wrappers</h1><main id="root"></main><script>for(let i=0;i<200;i++)root.insertAdjacentHTML('beforeend',`<div class="translated"><span class="wrapper"><span class="source">Price </span><span class="amount">$${i+1}.25</span></span></div>`);setTimeout(()=>document.querySelectorAll('.amount').forEach((n,i)=>n.replaceWith(Object.assign(document.createElement('span'),{className:'amount translated-value',textContent:'$'+(i+2)+'.25'}))),2500)</script></body></html>
