<!doctype html><html><head><meta charset="utf-8"><title>Static 100 prices</title><style>body{font:16px system-ui;margin:40px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:16px;border:1px solid #ccc;border-radius:8px}</style></head><body><h1>Static prices</h1><main class="grid" id="prices"></main><script>for(let i=1;i<=100;i++)prices.insertAdjacentHTML('beforeend',`<article class="card"><h2>Product ${i}</h2><strong>$${(i*12.37).toFixed(2)}</strong></article>`)</script></body></html>
