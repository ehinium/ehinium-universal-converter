<!doctype html><html><head><meta charset="utf-8"><title>Infinite scroll</title><style>.item{height:100px;border-bottom:1px solid #ddd}</style></head><body><main id="list"></main><script>let n=0;function add(){for(let i=0;i<30;i++)list.insertAdjacentHTML('beforeend',`<div class="item">Product ${n}: $${++n}.99</div>`)}add();addEventListener('scroll',()=>{if(scrollY+innerHeight>document.body.scrollHeight-300&&n<300)add()})</script></body></html>
