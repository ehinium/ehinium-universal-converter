<!doctype html><html><head><meta charset="utf-8"><title>Mutation-heavy SPA</title></head><body><h1>Mutation-heavy SPA</h1><main id="app"></main><script>let tick=0;function render(){const fragment=document.createDocumentFragment();for(let i=0;i<80;i++){const card=document.createElement('div');card.textContent=`Item ${tick}-${i}: $${(i+tick+1)*3}.49`;fragment.append(card)}app.replaceChildren(fragment);tick++;if(tick<20)setTimeout(render,100)}render();history.pushState({},'',location.pathname+'#loaded')</script></body></html>
