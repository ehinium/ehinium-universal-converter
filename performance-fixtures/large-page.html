<!doctype html><html><head><meta charset="utf-8"><title>10,000 text nodes</title></head><body><h1>Large deterministic page</h1><main id="root"></main><script>const fragment=document.createDocumentFragment();for(let i=0;i<10000;i++){const span=document.createElement('span');span.append(`Node ${i}${i%20===0?` price $${i+1}.99`:''}`);fragment.append(span,document.createTextNode(' '))}root.append(fragment)</script></body></html>
